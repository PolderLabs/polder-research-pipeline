name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.1
      - uses: actions/setup-python@82d7f9d7c4d8b6c3f8a3a5b9c8a4e9d7c4b1e0c6 # v5.0.0
        with:
          python-version: "3.12"
      - run: pip install -U pip
      - run: pip install "ruff>=0.1"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.1
      - uses: actions/setup-python@82d7f9d7c4d8b6c3f8a3a5b9c8a4e9d7c4b1e0c6 # v5.0.0
        with:
          python-version: "3.12"
      - run: pip install -U pip
      - run: pip install -e .
      - run: pip install -e ".[dev]"
      - name: Run pytest
        env:
          PYTHONPATH: src
        run: pytest -v

  vault-audit:
    name: Vault audit (clean = exit 0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.1
      - uses: actions/setup-python@82d7f9d7c4d8b6c3f8a3a5b9c8a4e9d7c4b1e0c6 # v5.0.0
        with:
          python-version: "3.12"
      - name: Vault audit
        env:
          PYTHONPATH: src
        run: python3 skills/obsidian-knowledgebase-curator/scripts/vault_audit.py

  schema-validate:
    name: Schema validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.1
      - uses: actions/setup-python@82d7f9d7c4d8b6c3f8a3a5b9c8a4e9d7c4b1e0c6 # v5.0.0
        with:
          python-version: "3.12"
      - run: pip install -U pip
      - run: pip install jsonschema pyyaml
      - name: Validate all role manifests
        run: |
          python3 -c "
          import sys, json, yaml
          from pathlib import Path
          from jsonschema import Draft202012Validator
          base = Path('agents/roles')
          for p in sorted(base.glob('*.yaml')):
              manifest = yaml.safe_load(p.read_text())
              assert manifest['schema_version'] == 1
              assert manifest['role'] == p.stem
              print(f'OK: {p}')
          print('All role manifests valid')
          "
      - name: Validate research.config.yaml
        run: |
          python3 -c "
          import yaml
          c = yaml.safe_load(open('research.config.yaml'))
          assert c['schema_version'] == 1
          print('OK: research.config.yaml')
          "
      - name: Validate all JSON schemas parse
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path
          for p in sorted(Path('schemas').glob('*.schema.json')):
              json.loads(p.read_text())
              print(f'OK: {p}')
          print('All schemas valid JSON')
          "
