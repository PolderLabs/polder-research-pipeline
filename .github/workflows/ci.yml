name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege defaults: every job that does not override `permissions`
# inherits this read-only token (AUDIT.md §42 — minimum workflow permissions).
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install ruff
        run: python -m pip install "ruff>=0.1"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install package with dev extras
        # Single editable install: `pip install -e .` followed by
        # `pip install -e ".[dev]"` is redundant; the extras form installs
        # the package exactly once with the dev tooling included.
        run: python -m pip install -e ".[dev]"
      - name: Run pytest
        env:
          PYTHONPATH: src
        run: pytest -v

  vault-audit:
    name: Vault audit (clean = exit 0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Vault audit
        env:
          PYTHONPATH: src
        run: python3 skills/obsidian-knowledgebase-curator/scripts/vault_audit.py

  schema-validate:
    name: Schema validation and generated drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Validate role manifests
        run: |
          python3 -c "
          import yaml
          from pathlib import Path
          base = Path('agents/roles')
          for p in sorted(base.glob('*.yaml')):
              manifest = yaml.safe_load(p.read_text())
              assert manifest['schema_version'] == 1, p
              assert manifest['role'] == p.stem, p
              print(f'OK: {p}')
          print('All role manifests valid')
          "
      - name: Validate research.config.yaml
        run: |
          python3 -c "
          import yaml
          c = yaml.safe_load(open('research.config.yaml'))
          assert c['schema_version'] == 1
          print('OK: research.config.yaml')
          "
      - name: Validate JSON schemas parse
        run: |
          python3 -c "
          import json
          from pathlib import Path
          for p in sorted(Path('schemas').glob('*.schema.json')):
              json.loads(p.read_text())
              print(f'OK: {p}')
          print('All schemas valid JSON')
          "
      - name: Generated drift check
        # AUDIT.md §41.4 — run generators and require a clean git diff.
        # The repository does not yet publish a public generator entry
        # point; until one exists this step enforces the policy that any
        # tracked file under .research/generated/ must not drift from the
        # committed copy. When a generator lands, invoke it here before
        # the diff so the check proves regeneration is clean.
        run: |
          set -euo pipefail
          if [ -d .research/generated ]; then
            if ! git diff --exit-code -- .research/generated; then
              echo '::error::Generated drift detected under .research/generated' >&2
              exit 1
            fi
          else
            echo 'No .research/generated/ directory present; drift check is a no-op.'
          fi

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
