[project]
name = "polder-research-pipeline"
version = "0.1.0"
description = "Repository-native framework for structured, agent-driven research."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [{name = "Polder Labs"}]
classifiers = ["Development Status :: 3 - Alpha"]

dependencies = [
    "jsonschema>=4.17",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.13",
]

[project.scripts]
polder-research = "polder_research.scripts:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polder_research"]

[tool.pytest.ini_options]

