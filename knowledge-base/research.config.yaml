# research.config.yaml — authoritative pipeline configuration (AUDIT.md §22)
#
# This file is the policy vocabulary and defaults reference. Some runtime
# consumers still use Python constants; strict-review invariants are enforced
# by the research-method API and schemas. Do not infer runtime enforcement
# from the presence of a configuration key.
#
# Canonical policy and vocabularies for current implementations. Not every
# runtime currently consumes every setting; see README and AUDIT.md for limits.

schema_version: 1
pipeline_version: "0.1.0"

# ─── Automatic classification ────────────────────────────────────────────────
# Jev calls TypeSafe's hosted API. Laya runs in-process with local model
# weights; installing the optional extra does not download weights until first
# classification. Neither provider silently falls back to the other.
classification:
  enabled: true
  provider: rules # rules | jev | laya; switch here
  minimum_confidence: 0.75
  max_input_chars: 12000
  jev:
    endpoint: https://api.typesafe.ai/v1/systemone
    model: jev-latest
    api_key_env: TYPESAFE_API_KEY
    timeout_seconds: 30
  laya:
    model: multilingual
    device: auto # auto | cpu | cuda | mps
  taxonomy:
    version: "2026-09-24.1"
    categories:
      project: {description: Project goals, requirements, and constraints, keywords: [polder, project, requirements]}
      research: {description: Research findings, models, papers, methods, or technology landscape, keywords: [research, paper, study, benchmark, model]}
      system: {description: System architecture, performance, transports, deployment, or runtime, keywords: [architecture, system, runtime, deployment]}
      decision: {description: Decisions, comparisons, or risk assessments, keywords: [decision, comparison, tradeoff, risk]}
      operation: {description: Experiments, benchmarks, roadmaps, or operational work, keywords: [experiment, benchmark, roadmap, operation]}
      other: {description: Material outside the listed knowledge-base categories, keywords: []}
    tags:
      artificial-intelligence: {description: artificial intelligence and machine learning, keywords: [artificial intelligence, machine learning, neural, llm]}
      real-time: {description: real-time processing, streaming, or low-latency systems, keywords: [real-time, realtime, streaming, latency]}
      visual-models: {description: visual generation, rendering, or vision models, keywords: [visual, image generation, rendering, vision model]}
      evaluation: {description: evaluation, benchmarks, or measurement, keywords: [evaluation, benchmark, metric, measurement]}
      methodology: {description: research methods, protocols, or evidence synthesis, keywords: [methodology, protocol, systematic review, evidence synthesis]}
      open-source: {description: open-source projects, repositories, or software, keywords: [open-source, github, repository, license]}

# ─── Vault scan scope ───────────────────────────────────────────────────────
# Controls what the vault_audit and frontmatter_fix tools consider "in scope".
# Align with SKIP_PARTS in paths.py and scripts.
scan:
  content_plane_dirs:
    - "00-home"
    - "01-project"
    - "02-research"
    - "03-system"
    - "04-decisions"
    - "05-operations"
    - "06-sources"
    - "90-inbox"
    - "99-templates"
  control_plane_dirs:
    - "agents"
    - "schemas"
    - "src"
    - "tests"
    - ".research"
    - "skills"
    - ".githooks"
    - ".github"
  skip_patterns:
    - ".git"
    - ".obsidian"
    - ".wolf"
    - ".claude"
    - ".codex"
    - "node_modules"
    - ".venv"
    - "dist"
    - "build"

# ─── Frontmatter vocabulary ─────────────────────────────────────────────────
frontmatter:
  required_keys:
    - type
    - status
    - tags
  valid_types:
    - index
    - moc
    - guide
    - template
    - inbox
    - project
    - research
    - system
    - decision
    - operation
    - experiment
    - source
  valid_status_values:
    - current
    - draft
    - stale
    - superseded

# ─── Intake lifecycle ───────────────────────────────────────────────────────
intake:
  valid_status:
    - new
    - triaged
    - processing
    - distilled
    - filed
    - rejected
    - blocked
  valid_kind:
    - pdf
    - repository
    - article
    - paper
    - log
    - transcript
    - media
    - url-list
    - documentation
    - webpage
    - dataset
    - benchmark
    - video
    - audio
    - book
    - standard
    - issue
    - discussion
    - other

# ─── Task lifecycle ─────────────────────────────────────────────────────────
task:
  valid_status:
    - pending
    - leased
    - in_progress
    - awaiting_handoff
    - completed
    - failed
    - blocked
    - abandoned
  valid_task_kind:
    - intake
    - acquire
    - process
    - classify
    - verify
    - distill
    - synthesize
    - query
    - maintain
    - evolve
    - decide
    - plan
    - search
    - screen
    - extract
    - adjudicate
    - appraise
    - report

# ─── Research method policy ────────────────────────────────────────────────
research_method:
  valid_methods:
    - continuous_intelligence
    - systematic_evidence_review
  systematic_evidence_review:
    protocol_required_before_activation: true
    protocol_frozen_before_search: true
    nonempty_search_requires_saved_export_sha256: true
    candidate_records_separate_from_acquired_sources: true
    screening_requires_independent_human_reviewers: 2
    extraction_requires_independent_human_reviewers: 2
    disagreement_requires_protocol_adjudication: true
    completion_requires_generated_review_report: true
    completion_requires_duplicate_independent_appraisal: false
  limits:
    reviewer_identity_authenticated: false
    review_report_is_portable_archive: false
    authoritative_records_shared_by_default: false
    method_record_events_complete: false
  lease_ttl_seconds: 300

# ─── Source model ───────────────────────────────────────────────────────────
source:
  valid_source_type:
    - paper
    - documentation
    - repository
    - webpage
    - article
    - dataset
    - benchmark
    - video
    - audio
    - transcript
    - book
    - standard
    - issue
    - discussion
    - other
  valid_media_type:
    - pdf
    - html
    - markdown
    - text
    - json
    - csv
    - image
    - audio
    - video
    - git
    - api
    - other

# ─── Claim model ────────────────────────────────────────────────────────────
claim:
  valid_status:
    - draft
    - verified
    - disputed
    - refuted
    - superseded
    - archived
  valid_claim_kind:
    - factual
    - quantitative
    - comparative
    - causal
    - predictive
    - definitional
    - methodological
    - opinion
    - other

# ─── Decision model ─────────────────────────────────────────────────────────
decision:
  valid_status:
    - proposed
    - accepted
    - review-due
    - superseded
    - rejected

# ─── Freshness policy ───────────────────────────────────────────────────────
freshness:
  defaults:
    - volatility: moderate
      review_after_days: 90
    - volatility: very-short
      review_after_days: 1
    - volatility: short
      review_after_days: 14
    - volatility: long
      review_after_days: 180
    - volatility: event-triggered
      review_after_days: null
      trigger_on: ["source.updated_at", "source.retracted"]
    - volatility: stable
      review_after_days: 365

# ─── Run model ─────────────────────────────────────────────────────────────
run:
  valid_status:
    - draft
    - active
    - paused
    - completed
    - aborted
    - failed

# ─── Handoff model ─────────────────────────────────────────────────────────
handoff:
  valid_status:
    - open
    - accepted
    - rejected
    - expired
  default_ttl_seconds: 600

# ─── Maintenance ────────────────────────────────────────────────────────────
maintenance:
  orphan_check_enabled: true
  orphan_exclude_dirs:
    - "90-inbox"
    - "99-templates"
  frontmatter_check_enabled: true
  broken_link_check_enabled: true
  staleness_check_enabled: true
  health_compute_interval_hours: 24
  # Maintenance rule evaluation thresholds (AUDIT.md §21). All maintenance
  # thresholds referenced by code live here — no hard-coded defaults.
  incremental_interval_days: 30
  max_unresolved_duplicates: 5
  max_unresolved_critical_conflicts: 0
  # Freshness engine: records older than N days are flagged stale in the
  # maintenance report regardless of their declared source_status.
  stale_after_days: 180
