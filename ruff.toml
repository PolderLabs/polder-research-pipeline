# ruff.toml — linter and formatter configuration for polder-research-pipeline
# See pyproject.toml for full [tool.ruff] configuration

line-length = 100
target-version = "py313"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line too long — handled by formatter
]
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"tests/*" = ["S101", "B011", "PLR2004"]  # assert statements, no complex len checks, magic values ok in tests
"skills/**" = ["E402"]  # import at top of file not required in scripts

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
