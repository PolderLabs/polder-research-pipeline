schema_version: 1
role: orchestrator
description: Top-level coordinator — creates runs, decomposes briefs, assigns tasks.
tools:
  - create_run
  - create_task
  - emit_event
  - read_state
  - handoff_task
  - abort_run
  - research_methods.verify_run_protocol
  - research_methods.validate_run_for_completion
read:
  - .research/state.json
  - .research/health.json
  - .research/protocols/**
  - .research/reports/**
  - .research/searches/**
  - .research/screenings/**
  - .research/extractions/**
  - .research/appraisals/**
  - knowledge-base/01-project/brief.md
write:
  - .research/runs/**
  - .research/tasks/**
  - .research/events/**
  - .research/handoffs/**
forbidden:
  - schemas/**
  - agents/**
  - .research/sources/**
  - .research/claims/**
