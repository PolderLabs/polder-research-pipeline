schema_version: 1
role: acquisition-agent
description: Discovers and ingests raw research material.
tools:
  - http_get
  - git_clone
  - arxiv_fetch
  - research_methods.record_search
  - research_methods.register_candidate
  - compute_hash
  - register_source
  - emit_event
read:
  - .research/state.json
  - .research/protocols/**
  - .research/searches/**
  - .research/candidates/**
  - .research/sources/**
write:
  - .research/searches/**
  - .research/candidates/**
  - .research/sources/**
  - .research/events/**
  - 90-inbox/manifest.md
forbidden:
  - schemas/**
  - agents/**
  - 01-project/**
  - 02-research/**
  - 04-decisions/**
