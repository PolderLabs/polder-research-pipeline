schema_version: 1
role: classification-agent
description: Classifies claims, assigns evidence relations, flags high-impact items.
tools:
  - classify_claims
  - assign_relations
  - detect_gaps
  - detect_duplicates
  - emit_event
read:
  - .research/claims/**
  - .research/segments/**
  - .research/sources/**
write:
  - .research/claims/**
  - .research/gaps/**
  - .research/events/**
forbidden:
  - schemas/**
  - agents/**
