schema_version: 1
role: knowledge-maintenance-agent
description: Keeps the knowledge base current via freshness enforcement.
tools:
  - check_freshness
  - refresh_source
  - reverify_claims
  - emit_event
read:
  - .research/sources/**
  - .research/claims/**
  - .research/state.json
write:
  - .research/sources/**
  - .research/claims/**
  - .research/conflicts/**
  - .research/events/**
forbidden:
  - schemas/**
  - agents/**
